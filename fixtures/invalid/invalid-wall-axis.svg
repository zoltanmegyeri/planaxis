<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 400"
  data-schema="apartment-svg"
  data-schema-version="2.2"
  data-unit="cm"
>
  <metadata><![CDATA[
    {
      "schema": "apartment-svg/2.2",
      "project": { "name": "Invalid wall axis fixture", "units": "cm" },
      "coordinateSystem": {
        "x": "right",
        "y": "down",
        "z": "up",
        "headingDegrees": { "0": "+x", "90": "+y", "180": "-x", "270": "-y" }
      },
      "level": { "id": "level-0", "baseZ": 0, "defaultCeilingHeight": 242 }
    }
  ]]></metadata>
  <g id="footprint">
    <polygon id="apartment-footprint" points="0,0 500,0 500,400 0,400" data-kind="footprint" />
  </g>
  <g id="spaces" />
  <g id="walls">
    <rect
      id="wall-square"
      x="10"
      y="10"
      width="20"
      height="20"
      data-kind="wall"
      data-axis="x"
      data-class="interior"
      data-status="fixed"
    />
  </g>
  <g id="windows" />
  <g id="doors" />
  <g id="fixed-elements" />
  <g id="utilities" />
  <g id="cameras" />
  <g id="annotations" />
</svg>
