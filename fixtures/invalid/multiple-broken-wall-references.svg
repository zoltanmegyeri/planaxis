<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 400"
  data-schema="apartment-svg"
  data-schema-version="2.1"
  data-unit="cm"
>
  <metadata><![CDATA[
    {
      "schema": "apartment-svg/2.1",
      "project": { "name": "Multiple broken references fixture", "units": "cm" },
      "coordinateSystem": {
        "x": "right",
        "y": "down",
        "z": "up",
        "headingDegrees": { "0": "+x", "90": "+y", "180": "-x", "270": "-y" }
      },
      "level": { "id": "level-0", "baseZ": 0, "defaultCeilingHeight": 242 }
    }
  ]]></metadata>
  <g id="spaces" />
  <g id="walls" />
  <g id="windows">
    <rect
      id="window-1"
      x="10"
      y="10"
      width="30"
      height="10"
      data-kind="window"
      data-wall="missing-wall-1"
      data-sill-height="80"
      data-opening-height="120"
      data-status="fixed"
    />
    <rect
      id="window-2"
      x="60"
      y="10"
      width="30"
      height="10"
      data-kind="window"
      data-wall="missing-wall-2"
      data-sill-height="80"
      data-opening-height="120"
      data-status="fixed"
    />
  </g>
  <g id="doors" />
  <g id="fixed-elements" />
  <g id="utilities" />
  <g id="cameras" />
  <g id="annotations" />
</svg>
